[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "structpick"
version = "0.1.1"
description = "Pick the best protein structure for docking: ranks PDB entries for a UniProt target, flags bound ligands and falls back to AlphaFold."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luís Felipe de Oliveira" }]
requires-python = ">=3.10"
dependencies = ["httpx>=0.27"]
keywords = ["bioinformatics", "structural-biology", "docking", "pdb", "alphafold", "uniprot", "drug-discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/felipsoliveira/structpick"
Issues = "https://github.com/felipsoliveira/structpick/issues"

[project.scripts]
structpick = "structpick.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
addopts = "-m 'not network'"
markers = ["network: hits the real EBI/UniProt APIs (deselected by default)"]
