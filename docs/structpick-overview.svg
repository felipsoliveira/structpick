<svg xmlns="http://www.w3.org/2000/svg" width="680" height="570" viewBox="0 0 680 570" role="img" aria-labelledby="title desc">
  <title id="title">How structpick selects a structure for docking</title>
  <desc id="desc">A UniProt accession is resolved to target metadata, candidate structures are found through PDBe and SIFTS, filters and ranking are applied, and ligand metadata is fetched in batches before returning a best experimental structure or an AlphaFold fallback.</desc>
  <style>
    .t,.ts,.th{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    .t{font-size:14px;font-weight:400;fill:#1a1a18}
    .ts{font-size:12px;font-weight:400;fill:#5f5e5a}
    .th{font-size:14px;font-weight:500;fill:#1a1a18}
    .bg{fill:#ffffff}
    .arr{stroke:#5f5e5a;stroke-width:1.5;fill:none}
    .c-gray>rect{fill:#f1efe8;stroke:#5f5e5a}
    .c-gray>.th{fill:#444441}.c-gray>.ts{fill:#5f5e5a}
    .c-purple>rect{fill:#eeedfe;stroke:#534ab7}
    .c-purple>.th{fill:#3c3489}.c-purple>.ts{fill:#534ab7}
    .c-teal>rect{fill:#e1f5ee;stroke:#0f6e56}
    .c-teal>.th{fill:#085041}.c-teal>.ts{fill:#0f6e56}
    .c-green>rect{fill:#eaf3de;stroke:#3b6d11}
    .c-green>.th{fill:#27500a}.c-green>.ts{fill:#3b6d11}
    .c-blue>rect{fill:#e6f1fb;stroke:#185fa5}
    .c-blue>.th{fill:#0c447c}.c-blue>.ts{fill:#185fa5}
    @media(prefers-color-scheme:dark){
      .t{fill:#e8e6de}.ts{fill:#b4b2a9}.th{fill:#e8e6de}.bg{fill:#1a1a18}.arr{stroke:#b4b2a9}
      .c-gray>rect{fill:#444441;stroke:#b4b2a9}.c-gray>.th{fill:#d3d1c7}.c-gray>.ts{fill:#b4b2a9}
      .c-purple>rect{fill:#3c3489;stroke:#afa9ec}.c-purple>.th{fill:#cecbf6}.c-purple>.ts{fill:#afa9ec}
      .c-teal>rect{fill:#085041;stroke:#5dcaa5}.c-teal>.th{fill:#9fe1cb}.c-teal>.ts{fill:#5dcaa5}
      .c-green>rect{fill:#27500a;stroke:#97c459}.c-green>.th{fill:#c0dd97}.c-green>.ts{fill:#97c459}
      .c-blue>rect{fill:#0c447c;stroke:#85b7eb}.c-blue>.th{fill:#b5d4f4}.c-blue>.ts{fill:#85b7eb}
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect class="bg" x="0" y="0" width="680" height="570" rx="16" fill="#ffffff"/>
  <text class="th" x="40" y="44">How structpick finds a docking structure</text>

  <g class="node c-gray">
    <rect x="65" y="58" width="550" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="77" text-anchor="middle" dominant-baseline="central">1 · Start with a UniProt accession</text>
    <text class="ts" x="340" y="96" text-anchor="middle" dominant-baseline="central">Resolve the target name, organism and sequence length</text>
  </g>
  <line x1="340" y1="114" x2="340" y2="136" class="arr" fill="none" marker-end="url(#arrow)"/>

  <g class="node c-purple">
    <rect x="65" y="142" width="550" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="161" text-anchor="middle" dominant-baseline="central">2 · Find experimental structures</text>
    <text class="ts" x="340" y="180" text-anchor="middle" dominant-baseline="central">PDBe + SIFTS map each PDB chain to the target sequence</text>
  </g>
  <line x1="340" y1="198" x2="340" y2="220" class="arr" fill="none" marker-end="url(#arrow)"/>

  <g class="node c-purple">
    <rect x="65" y="226" width="550" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="245" text-anchor="middle" dominant-baseline="central">3 · Filter and rank candidates</text>
    <text class="ts" x="340" y="264" text-anchor="middle" dominant-baseline="central">Method, sequence coverage and resolution; cheap filters first</text>
  </g>
  <line x1="340" y1="282" x2="340" y2="304" class="arr" fill="none" marker-end="url(#arrow)"/>

  <g class="node c-teal">
    <rect x="65" y="310" width="550" height="56" rx="8" stroke-width="0.5"/>
    <text class="th" x="340" y="329" text-anchor="middle" dominant-baseline="central">4 · Check for useful bound ligands</text>
    <text class="ts" x="340" y="348" text-anchor="middle" dominant-baseline="central">Batch unique PDB entries (up to 500 per request); check the target chain</text>
  </g>

  <path d="M340 366V386H195V406" class="arr" fill="none" marker-end="url(#arrow)"/>
  <path d="M340 366V386H485V406" class="arr" fill="none" marker-end="url(#arrow)"/>
  <g class="node c-green">
    <rect x="55" y="412" width="280" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="195" y="435" text-anchor="middle" dominant-baseline="central">Experimental result</text>
    <text class="ts" x="195" y="455" text-anchor="middle" dominant-baseline="central">Best eligible PDB chain for docking</text>
  </g>
  <g class="node c-blue">
    <rect x="345" y="412" width="280" height="66" rx="8" stroke-width="0.5"/>
    <text class="th" x="485" y="435" text-anchor="middle" dominant-baseline="central">Fallback</text>
    <text class="ts" x="485" y="455" text-anchor="middle" dominant-baseline="central">AlphaFold when no PDB match</text>
  </g>
  <text class="ts" x="340" y="515" text-anchor="middle" dominant-baseline="central">Holo checks ignore additives and ligands on other chains.</text>
</svg>
